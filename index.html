<!DOCTYPE html>
<!--
  ============================================================
  FILE OVERVIEW: index.html, the homepage of my profile site
  ============================================================
  The HOMEPAGE of my profile site: who I am, and a way to contact me.

  Page layout from top to bottom:
    1. <nav>     : the site's navigation bar (Home, About, Projects), with "Home" highlighted
    2. <header>  : light/dark theme slide switch (pinned to the top right), two clocks
                   (the visitor's time and mine, added by main.js), my name, tagline, and photo
    3. <main>    : the Contact section (a form with name, email, phone, subject, message,
                   a subscribe checkbox, a hidden anti-spam field, and Send/Reset buttons;
                   each text box shows a live character count). It starts open; click its
                   heading (or its arrow) to slide it closed and open again.
    4. <footer>  : copyright line

  This site has three pages, which all share the same files, kept in folders
  by type:
    - css/styles.css : all of the look and layout (colors, fonts, spacing)
    - js/main.js     : all of the interactive parts (theme switch, clocks,
                       sliding sections, forms)
    - images/        : the pictures (my profile photo and project screenshots)
  The CSS and JavaScript are linked in the <head> below. No frameworks are used.
  Comments like this one are "non-executable": the browser skips them
  and never shows them on the page. They're notes for whoever reads the code.

  The line above this comment, <!DOCTYPE html>, tells the browser
  "this is a modern HTML5 page." It must always be the very first line.
-->

<!-- START OF PAGE: <html> wraps the whole page. lang="en" tells browsers and screen readers the page is in English. -->
<html lang="en">

<!-- ===== HEAD: information ABOUT the page. Nothing in here shows up on the page itself. ===== -->
<head>
  <!-- Sets the character encoding so letters, symbols, and punctuation display correctly. -->
  <meta charset="UTF-8">
  <!-- Makes the page fit the width of the screen, so it works on phones too. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The text shown on the browser tab. -->
  <title>Jeffrey D. Moir | Profile</title>
  <!-- A one-sentence summary of the page. Search engines like Google show it under the page's
       title in their results, and apps like texts, Slack, and LinkedIn often show it in link previews. -->
  <meta name="description" content="Jeffrey D. Moir is a career changer learning AI engineering, with a background in quality control, Lean Six Sigma, and root cause analysis.">
  <!-- The little icon shown on the browser tab (a "favicon"): my initials, JM, in a blue circle.
       Instead of pointing at a separate image file, the picture is written right here as SVG code
       (SVG = a way of describing a drawing with text). "data:image/svg+xml," means "the picture
       follows in this attribute." %23 is the code for the # sign, which can't be typed directly
       inside this kind of link. The circle uses the same blue as the page's light-theme accent. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232f5d8a'/%3E%3Ctext x='32' y='42' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23f7f6f3'%3EJM%3C/text%3E%3C/svg%3E">
  <!-- Links the SHARED stylesheet. Every page links this same file, so the whole site looks the
       same and a style only has to be changed in one place. rel="stylesheet" says "this file is CSS,"
       and href is where to find it: "css/styles.css" means "the file styles.css, inside the
       css folder that sits next to this page." -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Loads the SHARED JavaScript file, js/main.js (main.js, inside the js folder), which every page uses: it runs the theme switch, the clocks,
       the sliding sections, and the forms (each page only uses the parts it has).
       It's placed in the <head> (and not at the end of the page) on purpose: it needs to apply
       a saved theme choice BEFORE the page appears, so the page doesn't flash the wrong colors. -->
  <script src="js/main.js"></script>
</head>
<!-- ===== END OF HEAD ===== -->

<!-- ===== BODY: everything inside here is what you actually see on the page. ===== -->
<body>

  <!-- ===== NAV: the site's navigation bar, at the top of every page. <nav> tells browsers and
       screen readers "these are the main site links." The same three links are on every page. ===== -->
  <nav>
    <!-- An unordered list (<ul>) is the standard way to group navigation links. Each <li> is one list item. -->
    <ul>
      <!-- Each <a> is a link to one page of the site. href is the file it opens (all three pages
           sit in the same folder, so just the file name is enough).
           aria-current="page" marks the link to THE PAGE YOU'RE ON. Screen readers announce it as
           "current page," and styles.css highlights it, so you can see where you are. Each page
           puts it on its own link: here, "Home".
           data-text repeats the link's word. styles.css uses it to save room for the bold
           version of the word, so the links don't shift sideways when one turns bold.
           (If you rename a link, change its data-text to match.) -->
      <li><a href="index.html" data-text="Home" aria-current="page">Home</a></li>
      <li><a href="about.html" data-text="About">About</a></li>
      <li><a href="projects.html" data-text="Projects">Projects</a></li>
    </ul>
  </nav>
  <!-- ===== END OF NAV ===== -->

  <!-- ===== HEADER: the introduction at the top of the homepage (theme switch, clocks, name, tagline, photo). ===== -->
  <header>
    <!-- THEME SLIDE SWITCH: a small sliding switch that changes the page between light and dark.
         A sun sits on the left end and a moon on the right end. A round "knob" slides
         to whichever side is active. styles.css draws it and pins it to the top-right corner.
         type="button" = a plain button that runs code (it isn't part of the form and doesn't submit anything).
         id="theme-toggle" = a unique name so main.js can find it.
         role="switch" = tells screen readers this is an on/off switch, not an ordinary button.
         aria-checked = whether the switch is "on" ("true" = dark theme, "false" = light theme).
           main.js flips this value on every click, and styles.css uses it to move the knob.
         aria-label = the name screen readers announce, e.g. "Dark theme, switch, off".
         Inside: three <span>s (plain containers with no meaning of their own) for the sun, the moon,
         and the knob. aria-hidden="true" hides them from screen readers, since they're only decoration. -->
    <button type="button" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme">
      <span class="theme-icon theme-sun" aria-hidden="true">☀️</span>
      <span class="theme-icon theme-moon" aria-hidden="true">🌙</span>
      <span class="theme-knob" aria-hidden="true"></span>
    </button>

    <!-- TWO CLOCKS: main.js adds them here, just above the page's <h1> heading, when the page loads.
         They're built by main.js (instead of being written out in this file) because they only
         work with JavaScript running: this way there are never placeholder dashes or empty clocks
         on the page, and if JavaScript is off, the clocks simply don't appear.
         See "CLOCKS" in main.js for the HTML it adds. -->

    <!-- The main heading of the page: my name. A page should have only one <h1>. -->
    <h1>Jeffrey D. Moir</h1>
    <!-- A paragraph holding my tagline, which sits right under my name. -->
    <p>A career changer learning AI engineering</p>
    <!-- Profile photo (a placeholder for now: to use a real photo, save it as images/profile.jpg,
         replacing the placeholder, ideally square and at least 400x400 pixels).
         src    = where the image comes from: profile.jpg, inside the images folder
         alt    = a text description, read aloud by screen readers and shown if the image fails to load
         width/height = the size it's shown at, in pixels, so the page saves the right amount of
                        space while it loads (the file itself is twice as big, so it stays sharp
                        on high-resolution screens) -->
    <img src="images/profile.jpg" alt="Profile photo of Jeffrey D. Moir" width="200" height="200">
  </header>
  <!-- ===== END OF HEADER ===== -->

  <!-- ===== MAIN: the central content of the page. A page should have only one <main>. ===== -->
  <main>

    <!-- ----- CONTACT SECTION: a form visitors can fill out to send me a message.
         id="contact" gives this section a unique name, so a link like index.html#contact can jump straight to it. ----- -->
    <section id="contact">
      <!-- Open/close box, starting open ("open"). It wraps the heading and the whole form.
           The About section in about.html explains how <details> and <summary> work. -->
      <details open>
      <summary><h2>Contact</h2><span class="section-arrow" aria-hidden="true"></span></summary>

      <!-- START OF CONTACT FORM: <form> groups all the fields so they get sent together when the button is clicked.
           There is no "action" (where to send the data) yet, so for now clicking Send just reloads the page.
           A real destination will be added later. -->
      <form>

        <!-- NAME FIELD: <label for="name"> is connected to the input with id="name".
             That link lets screen readers announce the label, and clicking the label puts the cursor in the box.
             type="text" = a single line of text. "required" = the browser won't send the form if this is empty.
             pattern = a rule the entry must match, so real names like "O'Brien", "Mary-Jane", "José", and "Jeffrey D. Moir" work.
             Reading the rule piece by piece:
               \p{L}      = the first character must be a letter from any language (so A, z, é, ñ, ü all count)
               [ ... ]*   = then any number (*) of the characters listed inside the brackets:
                   \p{L}  = any letter
                   \p{M}  = accent marks that some keyboards type as a separate piece after a letter
                   ' and ’ = straight and curly apostrophes (phones often turn ' into ’ automatically)
                   space and . = for middle names and initials
                   \-     = a hyphen (the backslash tells the browser it means a real "-")
             Numbers and other symbols (like @ or #) are still rejected.
             title = the hint the browser shows when the entry breaks that rule. -->
        <p>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" pattern="\p{L}[\p{L}\p{M}'’ .\-]*" title="Please use letters, spaces, hyphens, apostrophes, or periods." required>
          <!-- CHARACTER COUNT: the small number under the box's right edge. <small> is the HTML tag
               for small side notes. data-for="name" tells main.js which box this counter belongs to,
               and main.js updates the number as the visitor types. Every text box has one. -->
          <small class="char-count" data-for="name">0</small>
        </p>

        <!-- EMAIL FIELD: type="email" makes the browser check that the entry looks like an email address.
             On phones it also shows a keyboard with the @ key. "required" = must be filled in.
             pattern = a stricter rule than type="email" alone (which accepts "me@home" with no dot).
             It needs: something, then @, then something, then a dot, then something:
               [^@\s]+  = one or more characters that are NOT an @ or a space (\s means any space)
               @        = exactly one @
               \.       = a real dot (the backslash means "an actual . character")
             While the address doesn't match yet, styles.css shows the text in red.
             title = the hint the browser shows if the form is sent with a bad address. -->
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Please enter an email address like name@example.com." required>
          <small class="char-count" data-for="email">0</small>
        </p>

        <!-- PHONE FIELD: type="tel" is for telephone numbers. On phones it shows a number keypad.
             It doesn't check the format (phone formats differ around the world), and it's optional because it has no "required". -->
        <p>
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
          <small class="char-count" data-for="phone">0</small>
        </p>

        <!-- SUBJECT DROPDOWN: <select> creates a drop-down menu, and each <option> is one choice in it.
             "value" is what gets sent with the form; the text between the tags is what the visitor sees.
             The first option is picked by default. -->
        <p>
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="general">General</option>
            <option value="project-inquiry">Project inquiry</option>
            <option value="other">Other</option>
          </select>
        </p>

        <!-- MESSAGE BOX: <textarea> is a larger, multi-line text box for longer messages.
             "placeholder" shows grey hint text that disappears when the visitor starts typing.
             rows = how many lines tall the box starts. "required" = must be filled in. -->
        <p>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell me what you'd like to talk about..." required></textarea>
          <small class="char-count" data-for="message">0</small>
        </p>

        <!-- SUBSCRIBE CHECKBOX: type="checkbox" is a box the visitor can tick or leave blank.
             If ticked, the form sends subscribe=yes (the "value"). If left blank, nothing is sent for it.
             The label comes after the box here, which is the usual order for checkboxes. -->
        <p>
          <input type="checkbox" id="subscribe" name="subscribe" value="yes">
          <label for="subscribe">Subscribe me to occasional updates.</label>
        </p>

        <!-- HONEYPOT FIELD (anti-spam trap): a field real people never see, so they leave it empty.
             Spam bots fill in every field they find, so if this one has text, the message is from a bot and can be thrown away.
             The "hidden" attribute keeps the whole paragraph off the page without needing CSS.
             aria-hidden="true" = screen readers skip it too.
             tabindex="-1" = pressing Tab never lands on it.
             autocomplete="off" = the browser won't auto-fill it for a real visitor by mistake.
             The name "website" is chosen on purpose because it looks like a normal field to a bot. -->
        <p hidden aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </p>

        <!-- BUTTONS: both sit in the same paragraph so they appear side by side.
             type="submit" = sends the form (the browser checks the required fields and the name pattern first).
             type="reset"  = clears every field back to how it started. It doesn't send anything. -->
        <p>
          <button type="submit">Send message</button>
          <button type="reset">Reset</button>
        </p>

      </form>
      <!-- END OF CONTACT FORM -->

      </details>
    </section>
    <!-- ----- END OF CONTACT SECTION ----- -->

  </main>
  <!-- ===== END OF MAIN ===== -->

  <!-- ===== FOOTER: the closing area at the bottom of the page, usually for copyright and contact info. ===== -->
  <footer>
    <!-- Copyright line. &copy; is a special code that displays the © symbol. -->
    <p>&copy; 2026 Jeffrey D. Moir. All rights reserved.</p>
  </footer>
  <!-- ===== END OF FOOTER ===== -->

</body>
<!-- ===== END OF BODY ===== -->

</html>
<!-- END OF PAGE -->
